<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 578 288" width="578" height="288" role="img" aria-label="ASCII art eye that blinks and looks around">
<title>ASCII art eye that blinks and looks around</title>
<!-- Static fallback: with animation off, every element sits in its resting state (eye open, iris centered). -->
<rect width="578" height="288" rx="12" fill="#000"/>
<defs>
<clipPath id="lids">
<rect x="0" y="0" width="578" height="288">
<!-- Blink: the visible window closes down to one row every 5s (10s loop, two blinks). -->
<animate attributeName="y" dur="10s" repeatCount="indefinite" keyTimes="0;.46;.472;.48;.5;.95;.962;.97;.99;1" values="0;0;192;192;0;0;192;192;0;0"/>
<animate attributeName="height" dur="10s" repeatCount="indefinite" keyTimes="0;.46;.472;.48;.5;.95;.962;.97;.99;1" values="288;288;16;16;288;288;16;16;288;288"/>
</rect>
</clipPath>
</defs>
<g clip-path="url(#lids)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="14" fill="#dcdcdc" xml:space="preserve">
<g fill="#b0b0b0">
<!-- Scanline flicker on the outer rows. -->
<animate attributeName="opacity" dur="4.3s" repeatCount="indefinite" values="1;.65;.95;.75;1"/>
